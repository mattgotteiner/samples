[project]
name = "work-iq-a2a-foundry"
version = "1.0.0"
description = "Call Microsoft Work IQ from an Azure AI Foundry agent over the Agent2Agent (A2A) protocol with OAuth identity passthrough."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "azure-ai-projects>=2.0.0",
    "azure-identity>=1.21.0",
    "openai>=1.108.0",
]

[project.scripts]
work-iq-a2a-foundry = "work_iq_a2a_foundry.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/work_iq_a2a_foundry"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "e2e: end-to-end test that uses real Azure resources (deselect with -m 'not e2e')",
]
