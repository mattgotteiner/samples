name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  work-iq-a2a-foundry:
    name: work-iq-a2a-foundry (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-iq-a2a-foundry
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -m "not e2e"

  infra:
    name: Validate azd template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-iq-a2a-foundry
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Build Bicep template
        run: bicep build infra/main.bicep --stdout > /dev/null

      - name: Lint Bicep template
        run: bicep lint infra/main.bicep
